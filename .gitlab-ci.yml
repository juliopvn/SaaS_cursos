# Pipeline: feature/* → MR → main. "Pipelines must succeed" en main: solo código con CI en
# verde llega al mirror de GitHub y, por tanto, a Vercel. Ver AGENTS.md §9.
#
# Todas las credenciales de este fichero son ficticias, de solo lectura dentro del pipeline
# (Mongo/MailHog/RustFS efímeros de CI). No hace falta ningún secreto real para que el pipeline
# pase; los secretos de producción se configuran directamente en Vercel.

stages:
  - install
  - quality
  - build
  - e2e
  - deploy-verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  # --- Config ficticia común a quality/build/e2e (nunca se usa contra un servicio real) ---
  APP_URL: "http://localhost:3100"
  AUTH_SECRET: "ci-fictitious-secret-not-a-real-value-0123456789"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_NAME: "Admin"
  MAIL_PROVIDER: "smtp"
  MAIL_FROM: "Cursos <no-reply@localhost>"
  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  S3_ENDPOINT: "http://rustfs:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "saas-cursos-files"
  S3_ACCESS_KEY_ID: "rustfsadmin"
  S3_SECRET_ACCESS_KEY: "rustfsadmin"
  S3_FORCE_PATH_STYLE: "true"
  MAX_UPLOAD_MB: "10"
  MONGODB_URI: "mongodb://mongo:27017"
  E2E_BASE_URL: "http://localhost:3100"
  E2E_MONGODB_DB: "saas-cursos-e2e"
  MAILHOG_API_URL: "http://mailhog:8025"

default:
  image: node:22-bookworm-slim
  # Runner compartido de este proyecto: solo recoge jobs con esta etiqueta.
  tags:
    - cloudrun
  cache:
    key:
      files: [package-lock.json]
    paths:
      - .npm-cache/

.install: &install
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false

install:
  stage: install
  <<: *install
  script:
    - echo "Dependencias instaladas y cacheadas por package-lock.json"

lint:
  stage: quality
  <<: *install
  script:
    - npm run lint

typecheck:
  stage: quality
  <<: *install
  script:
    - npm run typecheck

unit-test:
  stage: quality
  <<: *install
  script:
    - npm run test

audit:
  stage: quality
  <<: *install
  allow_failure: true
  script:
    - npm audit --omit=dev --audit-level=high

build:
  stage: build
  <<: *install
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  <<: *install
  services:
    - name: mongo:7
      alias: mongo
    - name: mailhog/mailhog
      alias: mailhog
    - name: rustfs/rustfs:latest
      alias: rustfs
  variables:
    RUSTFS_ACCESS_KEY: rustfsadmin
    RUSTFS_SECRET_KEY: rustfsadmin
    RUSTFS_ADDRESS: "0.0.0.0:9000"
    RUSTFS_CONSOLE_ENABLE: "false"
  script:
    - npx tsx scripts/init-storage.ts
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

deploy-verify:
  stage: deploy-verify
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  <<: *install
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # PROD_URL: variable de CI no secreta (Settings → CI/CD → Variables), p. ej.
  # https://cursos.jpavon-tech.com. El mirror conserva el SHA, así que /api/health debe acabar
  # devolviendo el mismo commit que este pipeline.
  script:
    - |
      echo "Esperando a que $PROD_URL despliegue $CI_COMMIT_SHA..."
      for i in $(seq 1 60); do
        BODY=$(curl -fsS "$PROD_URL/api/health" || echo '{}')
        COMMIT=$(node -e "process.stdout.write((JSON.parse(process.argv[1]).commit)||'')" "$BODY")
        DB=$(node -e "process.stdout.write((JSON.parse(process.argv[1]).db)||'')" "$BODY")
        if [ "$COMMIT" = "$CI_COMMIT_SHA" ] && [ "$DB" = "ok" ]; then
          echo "Desplegado: commit=$COMMIT db=$DB"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "Timeout esperando el despliegue (últimos datos: commit=$COMMIT db=$DB)"; exit 1
        fi
        sleep 10
      done
    - E2E_BASE_URL="$PROD_URL" npx playwright test --project=smoke
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days

diagnose:
  stage: quality
  timeout: 5m
  script:
    - cat /etc/os-release || true
    - echo "== curl/wget/tar =="; curl --version | head -1; wget --version | head -1; tar --version | head -1
    - echo "== mongodb download test =="
    - curl -fsSL -o /tmp/mongo.tgz "https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz" && tar tzf /tmp/mongo.tgz | grep bin/mongod
    - echo "== mailhog download test =="
    - curl -fsSL -o /tmp/mailhog "https://github.com/mailhog/MailHog/releases/download/v1.0.1/MailHog_linux_amd64" && chmod +x /tmp/mailhog && /tmp/mailhog --version || true
    - echo "== rustfs release listing =="
    - curl -fsSL "https://api.github.com/repos/rustfs/rustfs/releases/latest" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(j.tag_name);j.assets.forEach(a=>console.log(a.name))})"
    - echo "== start mongod smoke test =="
    - mkdir -p /tmp/mongo-bin /tmp/mongo-data && tar xzf /tmp/mongo.tgz -C /tmp/mongo-bin --strip-components=1
    - nohup /tmp/mongo-bin/bin/mongod --dbpath /tmp/mongo-data --bind_ip 127.0.0.1 --port 27017 --logpath /tmp/mongod.log > /tmp/mongod.out 2>&1 &
    - for i in $(seq 1 30); do grep -q "Waiting for connections" /tmp/mongod.log 2>/dev/null && break; sleep 1; done
    - cat /tmp/mongod.log | tail -20
    - npm install --no-save mongodb@7 --silent
    - node -e "require('mongodb').MongoClient.connect('mongodb://127.0.0.1:27017').then(c=>{console.log('MONGO_OK');return c.close()}).catch(e=>{console.error('MONGO_FAIL',e.message);process.exit(1)})"
